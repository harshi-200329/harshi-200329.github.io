<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harshita Pullamsetty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE a student portfolio you explore like a map app: clear, friendly, professional
   IDEA the OpenStreetMap website: a sidebar with search and results, a pannable map with markers
   PICTURE a real, zoomable map of Germany (and India) in OSM colours, one marker and study-area buffer per project
   COLOUR OSM land #f2efe9, water #aad3df, purple borders; four project colours; white sidebar
   TYPE Sora 700 for headings + DM Sans for text and labels
   LAYOUT laptop: 380px sidebar left, map fills the rest; phone: map on top, sidebar content below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15181d);--ink:light-dark(#16191f,#eceef2);--mute:light-dark(#5d6473,#a3aab7);--line:light-dark(#e4e7ec,#2b313a);--soft:light-dark(#f5f6f8,#1c2027);--land:light-dark(#f2efe9,#2a2c30);--water:light-dark(#aad3df,#1b2b35);--bord:light-dark(#b9a3c9,#76638a);--lab:light-dark(#222222,#e6e6e6);--clab:light-dark(#7a5c8f,#c3a9d6);--halo:light-dark(#ffffff,#15181d);--c1:#e4553a;--c2:#2a6fdb;--c3:#0f9a73;--c4:#d39500;--c5:#8b5cf6;--sh:0 1px 2px rgba(16,24,40,.08),0 8px 24px -10px rgba(16,24,40,.3)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,"DM Sans",sans-serif;letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0 0 .8em}
a{color:inherit}
button{font-family:inherit}
.app{display:grid;grid-template-columns:390px minmax(0,1fr);height:100%;min-height:600px}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);overflow:hidden;z-index:2}
.head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.id{display:flex;gap:14px;align-items:center}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font:700 18px Sora,sans-serif;position:relative}
.av::after{content:"";position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--c3);border:2px solid var(--bg)}
.id h1{font-size:21px}
.id p{margin:2px 0 0;color:var(--mute);font-size:14px}
.status{margin:14px 0 0;font-size:14px;display:flex;flex-wrap:wrap;gap:6px}
.status span{padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.status .on{background:color-mix(in srgb,var(--c3) 12%,var(--bg));border-color:color-mix(in srgb,var(--c3) 40%,transparent);color:var(--c3);font-weight:700}
.search{position:relative;display:block;margin-top:14px}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px 0 40px;font:16px "DM Sans",sans-serif;background:var(--soft);color:var(--ink)}
.search input:focus{outline:2px solid var(--c2);outline-offset:0;background:var(--bg)}
.search svg{position:absolute;left:13px;top:13px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{flex:1;height:46px;border:0;background:none;color:var(--mute);font-weight:700;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--c2)}
.tabs button:focus-visible{outline:2px solid var(--c2);outline-offset:-2px}
.pane{flex:1;overflow:auto;padding:8px 12px 20px}
.hint{font-size:13px;color:var(--mute);padding:8px 10px 4px}
.it{border:1px solid transparent;border-radius:12px;margin:4px 0}
.it.sel{border-color:var(--line);background:var(--soft)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 12px;padding:12px 10px;width:100%;border-radius:12px}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--c2)}
.row i{grid-row:1/3;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);margin-top:4px}
.row strong{font-size:15px}
.row em{font-style:normal;font-size:13px;color:var(--mute);white-space:nowrap}
.row small{grid-column:2/-1;color:var(--mute);font-size:13px}
.det{padding:0 12px 16px 38px;font-size:14px}
.big{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px}
.big b{font:700 26px Sora,sans-serif;color:var(--pc);white-space:nowrap}
.big span{color:var(--mute);font-size:13px}
.det h4{font:700 12px "DM Sans",sans-serif;color:var(--mute);margin:10px 0 2px}
.det ol{margin:0;padding-left:18px}
.det li{margin-bottom:3px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tags span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.empty{padding:20px 10px;color:var(--mute)}
.ab{padding:10px}
.ab p{font-size:15px}
.ab h3{font-size:15px;margin:18px 0 8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tl em{font-style:normal;color:var(--mute);font-size:13px;white-space:nowrap}
.tl small{grid-column:1/-1;color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.chips span.a{background:color-mix(in srgb,var(--c2) 10%,var(--bg));border-color:color-mix(in srgb,var(--c2) 35%,transparent)}
.ct{padding:10px}
.ct h2{font-size:22px;margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;text-decoration:none;margin-top:8px;cursor:pointer;font-size:15px}
.btn.p{background:var(--c2);border-color:var(--c2);color:#fff}
.btn:hover,.btn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 30%,transparent)}
.mail{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}
.mail button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;min-height:34px;padding:0 12px;font-weight:700;cursor:pointer}
.mapw{position:relative;background:var(--water);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.cty{fill:var(--land);stroke:var(--bord);stroke-width:1.4;stroke-dasharray:6 2 1.5 2;vector-effect:non-scaling-stroke}
.ring{fill:var(--rc);fill-opacity:.12;stroke:var(--rc);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
svg text{paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;font-family:"DM Sans",sans-serif}
.clab{fill:var(--clab);font-size:15px;font-weight:700;letter-spacing:.06em}
.plab{fill:var(--lab);font-size:13px;font-weight:500}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible .mk{stroke:var(--ink);stroke-width:3}
.ctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
.grp{background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.grp button{width:44px;height:44px;border:0;background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.grp button+button{border-top:1px solid var(--line)}
.grp button:focus-visible{outline:2px solid var(--c2);outline-offset:-2px}
.views{position:absolute;left:14px;top:14px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.views button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--sh)}
.views button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;box-shadow:var(--sh);transform:translate(-50%,calc(-100% - 46px));white-space:nowrap;display:none}
.onb{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:3;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;box-shadow:var(--sh);white-space:nowrap;transition:opacity .4s}
.onb.gone{opacity:0;pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 14px;font-size:12px;color:var(--mute);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.scale{display:flex;align-items:center;gap:8px;white-space:nowrap}
.scale i{display:block;height:7px;border:1.5px solid var(--ink);border-top:0}
.coord{font-variant-numeric:tabular-nums;white-space:nowrap}
.attr{white-space:nowrap}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);font-weight:500;padding:20px;text-align:center}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 56svh auto;height:auto}
 .side{display:contents}
 .head{order:1;border-bottom:0}
 .mapw{order:2;min-height:360px;border-block:1px solid var(--line)}
 .tabs{order:3;position:sticky;top:0;background:var(--bg);z-index:5}
 .pane{order:4;overflow:visible}
 .attr{display:none}
 .onb{bottom:44px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){.onb{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="head">
      <div class="id">
        <div class="av" aria-hidden="true">SH</div>
        <div><h1>SreeHarshita Pullamsetty</h1><p>Geoinformatics student · Berlin</p></div>
      </div>
      <div class="status">
        <span class="on">Open to working student roles</span>
        <span>QGIS · Python</span>
        <span>Up to 20 h/week</span>
      </div>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search projects, places or tools" aria-label="Search projects, places or tools" autocomplete="off"></label>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-p" aria-selected="true" data-t="p">Projects</button>
      <button role="tab" id="t-a" aria-selected="false" data-t="a">About</button>
      <button role="tab" id="t-c" aria-selected="false" data-t="c">Contact</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
  <div class="mapw" id="mapw">
    <svg id="map" role="application" aria-label="Map of my projects. Drag to pan, scroll or use the buttons to zoom."></svg>
    <div class="views" id="views">
      <button type="button" data-v="de" aria-pressed="true">Germany</button>
      <button type="button" data-v="in" aria-pressed="false">India</button>
    </div>
    <div class="ctl">
      <div class="grp"><button id="zi" type="button" aria-label="Zoom in">+</button><button id="zo" type="button" aria-label="Zoom out">−</button></div>
      <div class="grp"><button id="home" type="button" aria-label="Reset view"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="onb" id="onb">Click a marker to open a project · drag to explore</div>
    <div class="bar"><span class="scale"><i id="sbar" style="width:80px"></i><span id="stxt">100 km</span></span><span class="coord" id="coord">52.5200° N, 13.4050° E</span><span class="attr">Map data: Natural Earth · OpenStreetMap-style</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
{
const P=[
 {id:'fire',c:'var(--c1)',ll:[11.19,53.86],km:28,k:7,v:'de',t:'Fire station site selection',pl:'Nordwestmecklenburg',y:'2026',s:'Best of 23 suitable sites, ranked by drive time',n:'+450',nl:'more residents reached within 5 minutes',q:'Where should a new fire station go so it reaches the most people who are too far from one today?',m:['Turned 11 rules into map layers, like "not in a protected area" and "close to a main road".','Kept only land that passed every rule: 23 sites.','Measured drive times on the road network and ranked the sites.','Checked that the winner holds with 4- and 6-minute limits.'],r:'The site near Grevesmühlen wins clearly. The old straight-line winner ranks only 13th on drive time.',tg:['QGIS','Network analysis','Multi-criteria']},
 {id:'school',c:'var(--c2)',ll:[10.99,49.48],km:5,k:22,v:'de',t:'School Zone Speed Atlas',pl:'Fürth, Bavaria',y:'2026',s:'734 road segments near 45 schools classified',n:'734',nl:'road segments within 150 m of a school',q:'Are streets around schools actually slowed down, and is it because of the school?',m:['Downloaded roads and schools from OpenStreetMap with OSMnx.','Selected every segment within 150 m of a school with GeoPandas.','Sorted them into five speed categories.','Designed the final map in QGIS.'],r:'No road in OpenStreetMap was tagged as a school zone. I documented that data gap instead of hiding it.',tg:['Python','GeoPandas','OSMnx','Shapely','QGIS']},
 {id:'flood',c:'var(--c3)',ll:[79.07,30.74],km:18,k:0,v:'in',t:'Flood vulnerability and risk',pl:'Kedarnath valley, India',y:'In progress',s:'Flood risk mapping, checked against 2013',n:'5',nl:'layers: height, slope, river, people, buildings',q:'Which parts of the Kedarnath valley are most vulnerable to floods, and does the map match what happened in 2013?',m:['Built layers from elevation, river and OpenStreetMap data.','Scaled each layer from 0 to 1 so they can be combined.','Comparing four weighting methods, including AHP, to test how stable the result is.'],r:'The layers are done. Next: the risk map and the comparison with the 2013 flood.',tg:['QGIS','Raster analysis','AHP']},
 {id:'camp',c:'var(--c4)',ll:[10.69,53.87],km:9,k:14,v:'de',t:'Campsite suitability',pl:'Lübeck',y:'2026',s:'City filtered to campsite sites with 5 criteria',n:'5',nl:'criteria, plus a 2-hectare minimum',q:'Where in Lübeck could a small investor build a new campsite?',m:['Drew buffers for road access and distance to water.','Removed buildings and protected areas.','Kept only areas of at least 2 hectares.'],r:'A short list of sites, each traceable to the rules that kept it.',tg:['QGIS','Vector overlay','OpenStreetMap']},
 {id:'pharm',c:'var(--c5)',ll:[12.10,54.09],km:8,k:15,v:'de',t:'Pharmacy accessibility',pl:'Rostock',y:'2026',s:'Pharmacies per resident across all districts',n:'1st',nl:'QGIS project, self-taught',q:'Do all districts in Rostock have fair access to a pharmacy, especially older residents?',m:['Combined federal boundaries (BKG) with Rostock open data.','Reprojected everything to EPSG:25833 and joined population by age.','Calculated a pharmacy ratio per district and drew walking-distance buffers.'],r:'A choropleth map showing which districts are under-served.',tg:['QGIS','Choropleth','Buffers']}
];
const HOME=[{n:'Berlin',sub:'Where I live and work',ll:[13.405,52.52]},{n:'Neubrandenburg',sub:'Where I study',ll:[13.26,53.56]}];
const CITY=[['Berlin',13.405,52.52,0.8],['Hamburg',9.99,53.55,1],['München',11.58,48.14,1],['Köln',6.96,50.94,1],['Frankfurt',8.68,50.11,1.5],['Dresden',13.74,51.05,1.5],['Stuttgart',9.18,48.78,1.5],['Hannover',9.73,52.37,1.5],['Leipzig',12.37,51.34,2],['Nürnberg',11.08,49.45,1.8],['Rostock',12.10,54.09,1.8],['Neubrandenburg',13.26,53.56,2.2],['Lübeck',10.69,53.87,2.5],['Schwerin',11.41,53.63,3],['Wismar',11.46,53.89,4],['Grevesmühlen',11.19,53.86,5],['Fürth',10.99,49.48,6],['Erlangen',11.0,49.6,8],['New Delhi',77.21,28.61,.1],['Dehradun',78.03,30.32,.3],['Kathmandu',85.32,27.71,.2],['Kedarnath',79.07,30.74,1.2]];
const CTRY=[['DEUTSCHLAND',10.4,51.4],['POLSKA',19.4,52.1],['ČESKO',15.4,49.8],['ÖSTERREICH',14.5,47.6],['FRANCE',3.2,47.6],['NEDERLAND',5.7,52.4],['BELGIË',4.6,50.7],['DANMARK',9.3,56.1],['SCHWEIZ',8.2,46.8],['INDIA',79,22],['NEPAL',84,28.6],['CHINA',88,33.5],['PAKISTAN',69,29]];
const TL=[['M.Eng. Geoinformatics','Hochschule Neubrandenburg','2026 – now'],['Senior team member','Mmaah, Berlin · alongside my studies','2025 – now'],['Data science coursework','SRH University, Berlin','2025'],['B.Sc. (Hons) Statistics','Lady Shri Ram College, University of Delhi','2020 – 2023'],['Internships: marketing and HR','GoodSpace and IFORTIS, New Delhi','2021 – 2022']];
const SK=['QGIS','Python','GeoPandas','OSMnx','Shapely','Pandas','OpenStreetMap','Spatial analysis','Site selection','Network analysis','Raster analysis','AHP','Cartography','SQL','R','Git & GitHub','Tableau','Blender'];
const LEARN=['PostGIS','PyQGIS','Remote sensing','German'];

const st={tab:'p',sel:null,q:''};
const pane=document.getElementById('pane');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const match=p=>{const q=st.q.trim().toLowerCase();if(!q)return true;return [p.t,p.pl,p.s,p.q,...p.tg].join(' ').toLowerCase().includes(q)};
function renderPane(){
 if(st.tab==='p'){
  const list=P.filter(match);
  pane.innerHTML=`<p class="hint">${st.q?`${list.length} result${list.length===1?'':'s'} for “${esc(st.q)}”`:'5 projects on the map. Pick one to fly there.'}</p>`+(list.length?list.map(p=>{const sel=st.sel===p.id;return `<div class="it${sel?' sel':''}" style="--pc:${p.c}"><button class="row" data-p="${p.id}" aria-expanded="${sel}"><i></i><strong>${p.t}</strong><em>${p.y}</em><small>${p.pl} · ${p.s}</small></button>${sel?`<div class="det"><div class="big"><b>${p.n}</b><span>${p.nl}</span></div><h4>Question</h4><p>${p.q}</p><h4>What I did</h4><ol>${p.m.map(x=>`<li>${x}</li>`).join('')}</ol><h4>Result</h4><p>${p.r}</p><div class="tags">${p.tg.map(x=>`<span>${x}</span>`).join('')}</div></div>`:''}</div>`}).join(''):`<p class="empty">No project matches “${esc(st.q)}”. Try QGIS, Python or a city.</p>`);
 }else if(st.tab==='a'){
  pane.innerHTML=`<div class="ab"><p>I started in statistics, learned to code through data science, and found my field in geoinformatics: questions that start with “where”. I enjoy turning messy open data into one clear, well-documented map.</p><p class="muted" style="color:var(--mute)">I'm looking for a working student role where I get real GIS tasks, feedback and room to grow.</p><h3>Experience and education</h3><ul class="tl">${TL.map(t=>`<li><strong>${t[0]}</strong><em>${t[2]}</em><small>${t[1]}</small></li>`).join('')}</ul><h3>Skills</h3><div class="chips">${SK.map(x=>`<span class="a">${x}</span>`).join('')}</div><h3>Learning now</h3><div class="chips">${LEARN.map(x=>`<span>${x}</span>`).join('')}</div><h3>Languages</h3><p>English (fluent) · German (learning) · Telugu (native)</p></div>`;
 }else{
  pane.innerHTML=`<div class="ct"><h2>Let's talk maps</h2><p style="color:var(--mute)">Working student role, project idea or a quick coffee chat in Berlin: I'd be glad to hear from you.</p><a class="btn p" href="mailto:sreeharshi.p@gmail.com">Email me</a><a class="btn" href="https://www.linkedin.com/in/sreeharshita-pullamsetty-548532206" target="_blank" rel="noopener">LinkedIn</a><a class="btn" href="https://github.com/harshi-200329" target="_blank" rel="noopener">GitHub</a><div class="mail"><span>sreeharshi.p@gmail.com</span><button id="cp" type="button">Copy</button></div></div>`;
  const cp=document.getElementById('cp');cp.addEventListener('click',()=>{try{navigator.clipboard.writeText('sreeharshi.p@gmail.com').then(()=>{cp.textContent='Copied'},()=>{cp.textContent='Select to copy'})}catch(e){cp.textContent='Select to copy'}});
 }
}
function setTab(t){st.tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));renderPane()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t)});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;if(st.tab!=='p')setTab('p');else renderPane();drawOv()});
pane.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)select(b.dataset.p===st.sel?null:b.dataset.p)});
renderPane();

const svg=d3.select('#map'),wrap=document.getElementById('mapw');
const gBase=svg.append('g'),gRing=svg.append('g'),gOv=svg.append('g');
const proj=d3.geoMercator(),path=d3.geoPath(proj);
let geo=null,de=null,ind=null,W=0,H=0,T=d3.zoomIdentity,ready=false;
const zoom=d3.zoom().scaleExtent([.08,60]).on('zoom',e=>{T=e.transform;gBase.attr('transform',T);gRing.attr('transform',T);drawOv();scale();if(e.sourceEvent)hideOnb()});
svg.call(zoom).on('dblclick.zoom',null);
const onb=document.getElementById('onb');let onbT=setTimeout(hideOnb,7000);
function hideOnb(){onb.classList.add('gone');clearTimeout(onbT)}
function fit(){
 W=wrap.clientWidth;H=wrap.clientHeight;if(!W||!H||!geo)return;
 proj.fitExtent([[40,70],[W-70,H-50]],de);
 gBase.selectAll('path').attr('d',path);
 drawRing();
}
function viewFor(v){
 if(v==='de')return d3.zoomIdentity;
 const b=path.bounds(ind),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1],k=.85/Math.max(dx/W,dy/H),cx=(b[0][0]+b[1][0])/2,cy=(b[0][1]+b[1][1])/2;
 return d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy);
}
function go(t,ms=1100){const m=matchMedia('(prefers-reduced-motion: reduce)').matches;(m?svg:svg.transition().duration(ms).ease(d3.easeCubicInOut)).call(zoom.transform,t)}
function setView(v){document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)))}
function flyTo(p){
 const [x,y]=proj(p.ll);let k=p.k;
 if(p.v==='in')k=viewFor('in').k*9;
 const ox=W>700?0:0;
 go(d3.zoomIdentity.translate(W/2+ox,H/2+20).scale(k).translate(-x,-y));setView(p.v);
}
function select(id){
 st.sel=id;if(st.tab!=='p')setTab('p');else renderPane();hideOnb();
 drawRing();drawOv();
 const p=P.find(p=>p.id===id);if(p&&ready)flyTo(p);
 if(p){const el=pane.querySelector(`[data-p="${id}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
function drawRing(){
 gRing.selectAll('*').remove();const p=P.find(p=>p.id===st.sel);if(!p||!geo)return;
 gRing.append('path').datum(d3.geoCircle().center(p.ll).radius(p.km/111.32)()).attr('class','ring').style('--rc',p.c).attr('d',path);
}
const tip=document.getElementById('tip');const PINC=['Lübeck','Rostock','Grevesmühlen','Fürth','Kedarnath','Neubrandenburg','Berlin'];
function drawOv(){
 if(!geo)return;const k=T.k,sc=pt=>T.apply(proj(pt));let o='';
 const inView=([x,y])=>x>-60&&y>-60&&x<W+60&&y<H+60;
 for(const[n,lo,la]of CTRY){if(k>6)break;const p=sc([lo,la]);if(inView(p))o+=`<text class="clab" x="${p[0]}" y="${p[1]}" text-anchor="middle">${n}</text>`}
 for(const[n,lo,la,mk]of CITY){if(k<mk)continue;const p=sc([lo,la]);if(!inView(p))continue;const cap=n==='Berlin'||n==='New Delhi';
  o+=`<circle cx="${p[0]}" cy="${p[1]}" r="${cap?4.5:3}" fill="var(--bg)" stroke="var(--lab)" stroke-width="1.5"/>${cap?`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" fill="var(--lab)"/>`:''}${PINC.includes(n)?`<text class="plab" x="${p[0]-9}" y="${p[1]+16}" text-anchor="end">${n}</text>`:`<text class="plab" x="${p[0]+7}" y="${p[1]-6}" ${cap?'font-weight="700"':''}>${n}</text>`}`}
 for(const h of HOME){const p=sc(h.ll);if(!inView(p))continue;o+=`<g class="pin home" data-h="${h.n}" tabindex="0" role="button" aria-label="${h.n}: ${h.sub}" transform="translate(${p[0]} ${p[1]})"><circle r="11" fill="var(--ink)"/><path d="${h.n==='Berlin'?'M-5 1 L0 -4 L5 1 V5 H-5Z':'M-6 -1 L0 -4 L6 -1 L0 2Z M-3 1 V4 Q0 6 3 4 V1'}" fill="var(--bg)"/></g>`}
 const vis=P.filter(match);
 for(const p of P){const pt=sc(p.ll);if(!inView(pt))continue;const sel=st.sel===p.id,dim=!vis.includes(p),s=sel?1.25:1;
  o+=`<g class="pin" data-p="${p.id}" tabindex="0" role="button" aria-label="Open project: ${p.t}" transform="translate(${pt[0]} ${pt[1]}) scale(${s})" opacity="${dim?.25:1}">${sel?`<circle r="22" fill="${p.c}" opacity=".2"/>`:''}<ellipse cy="2" rx="8" ry="3" fill="rgba(0,0,0,.25)"/><path class="mk" d="M0 0C-12-14-14-20-14-28a14 14 0 1 1 28 0c0 8-2 14-14 28Z" fill="${p.c}" stroke="var(--bg)" stroke-width="2"/><circle cy="-28" r="5" fill="#fff"/></g>`;
  if(sel)o+=`<g transform="translate(${pt[0]+22} ${pt[1]-48})"><rect x="0" y="-15" width="${p.pl.length*7.4+22}" height="30" rx="8" fill="var(--bg)" stroke="var(--line)"/><text x="11" y="5" font-size="13" font-weight="700" fill="var(--ink)" style="stroke-width:0">${p.pl}</text></g>`}
 gOv.html(o);
}
gOv.on('click',e=>{const g=e.target.closest('.pin');if(!g)return;e.stopPropagation();if(g.dataset.p)select(g.dataset.p===st.sel?null:g.dataset.p);else setTab('a')});
gOv.on('keydown',e=>{const g=e.target.closest('.pin');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dataset.p?select(g.dataset.p):setTab('a')}});
gOv.on('mouseover',e=>{const g=e.target.closest('.pin');if(!g)return;const p=P.find(p=>p.id===g.dataset.p),h=HOME.find(h=>h.n===g.dataset.h);tip.textContent=p?`${p.t} · ${p.pl}`:`${h.n} · ${h.sub}`;const b=wrap.getBoundingClientRect(),r=g.getBoundingClientRect();tip.style.left=(r.left+r.width/2-b.left)+'px';tip.style.top=(r.bottom-b.top)+'px';tip.style.display='block'});
gOv.on('mouseout',()=>tip.style.display='none');
const co=document.getElementById('coord');
svg.on('pointermove',e=>{if(!geo)return;const[mx,my]=d3.pointer(e);const ll=proj.invert(T.invert([mx,my]));if(ll)co.textContent=`${Math.abs(ll[1]).toFixed(4)}° ${ll[1]>=0?'N':'S'}, ${Math.abs(ll[0]).toFixed(4)}° ${ll[0]>=0?'E':'W'}`});
function scale(){
 if(!geo)return;const a=proj.invert(T.invert([W/2,H/2])),b=proj.invert(T.invert([W/2+100,H/2]));if(!a||!b)return;
 const km=d3.geoDistance(a,b)*6371,nice=[1,2,5,10,20,50,100,200,500,1000,2000].find(n=>n>=km*.6)||2000,px=100*nice/km;
 document.getElementById('sbar').style.width=Math.min(px,160)+'px';document.getElementById('stxt').textContent=nice>=1?`${nice} km`:'';
}
document.getElementById('zi').addEventListener('click',()=>{hideOnb();svg.transition().duration(300).call(zoom.scaleBy,1.6)});
document.getElementById('zo').addEventListener('click',()=>{hideOnb();svg.transition().duration(300).call(zoom.scaleBy,1/1.6)});
document.getElementById('home').addEventListener('click',()=>{select(null);go(viewFor('de'),900);setView('de')});
document.getElementById('views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;hideOnb();setView(b.dataset.v);go(viewFor(b.dataset.v),1300)});

fetch('geo.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(g=>{
 geo=g;de=g.features.find(f=>f.properties.n==='Germany');ind=g.features.find(f=>f.properties.n==='India');
 gBase.selectAll('path').data(g.features).join('path').attr('class','cty');
 fit();ready=true;svg.call(zoom.transform,d3.zoomIdentity);
 const ro=new ResizeObserver(()=>{const k=T;fit();svg.call(zoom.transform,k)});ro.observe(wrap);
}).catch(()=>{wrap.insertAdjacentHTML('beforeend','<div class="err">The map could not load. The project list on the left still works.</div>')});
}
</script>
</body>
</html>
